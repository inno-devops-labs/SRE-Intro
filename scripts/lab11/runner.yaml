apiVersion: v1
kind: Pod
metadata:
  name: lab11-probe
  labels:
    app: lab11-probe
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: quickticket-gateway:lab11
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: probe
          mountPath: /probe
          readOnly: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
  volumes:
    - name: probe
      configMap:
        name: lab11-probe

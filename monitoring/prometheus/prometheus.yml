# QuickTicket monitoring — Prometheus scrape configuration (Lab 3)
#
# Targets are addressed by Compose service name on the shared app_default
# network, on the container-internal port. The published host ports (3080,
# 8081, 8082) are irrelevant here: Prometheus runs inside the same network
# and resolves the names through Docker's embedded DNS.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "events"
    static_configs:
      - targets: ["events:8081"]

  - job_name: "payments"
    static_configs:
      - targets: ["payments:8082"]

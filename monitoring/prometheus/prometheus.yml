global:
  scrape_interval: 5s
  evaluation_interval: 1m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: events
    metrics_path: /metrics
    static_configs:
      - targets: ["events:8081"]

  - job_name: payments
    metrics_path: /metrics
    static_configs:
      - targets: ["payments:8082"]

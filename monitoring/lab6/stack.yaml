        ports: []
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: lab6-loadgen
          mountPath: /app
          readOnly: true
        command:
        - python
        - -u
        - /app/loadgen.py
      volumes:
      - name: lab6-loadgen
        configMap:
          name: lab6-loadgen

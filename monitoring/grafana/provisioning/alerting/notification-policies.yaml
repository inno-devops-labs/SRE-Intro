# Lab 6 §6.4 — notification policy tree, provisioned as code.
# Default contact point = quickticket-alerts, grouped by alertname,
# 30s group wait, 5m repeat interval.
apiVersion: 1

policies:
  - orgId: 1
    receiver: quickticket-alerts
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 1m
    repeat_interval: 5m

apiVersion: 1

# --- Contact point: webhook (JSON POST) ---
contactPoints:
  - orgId: 1
    name: quickticket-alerts
    receivers:
      - uid: quickticket-webhook
        type: webhook
        settings:
          url: http://host.docker.internal:9099/grafana-webhook
          httpMethod: POST
        disableResolveMessage: false

# --- Notification policy (root) ---
policies:
  - orgId: 1
    receiver: quickticket-alerts
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 5m

# --- Alert rules ---
groups:
  - orgId: 1
    name: quickticket-slo
    folder: QuickTicket Alerts
    interval: 1m
    rules:
      # Alert 1 — High Error Rate (critical)
      - uid: qt-high-error-rate
        title: QuickTicket High Error Rate
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Gateway error rate is {{ $value }}%"
          description: "Error rate exceeded 5% for 2 minutes. Check payments service health."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: 'sum(rate(gateway_requests_total{status=~"5.."}[5m])) / sum(rate(gateway_requests_total[5m])) * 100'
              instant: false
              range: true
              intervalMs: 15000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: PBFA97CFB590B2093 }
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [5] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }

      # Alert 2 — SLO Burn Rate (warning)
      - uid: qt-slo-burn-rate
        title: QuickTicket SLO Burn Rate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SLO burn rate is {{ $value }}x the 99.5% budget"
          description: "Error budget burning >6x (30-day budget exhausts in <5 days). Investigate sustained errors."
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              refId: A
              editorMode: code
              expr: '(1 - (sum(rate(gateway_requests_total{status!~"5.."}[30m])) / sum(rate(gateway_requests_total[30m])))) / (1 - 0.995)'
              instant: false
              range: true
              intervalMs: 15000
              maxDataPoints: 43200
              datasource: { type: prometheus, uid: PBFA97CFB590B2093 }
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  evaluator: { type: gt, params: [6] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }

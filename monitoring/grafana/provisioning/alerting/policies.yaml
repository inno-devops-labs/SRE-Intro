apiVersion: 1

# Notification policy: route every alert to the quickticket-alerts contact point,
# group by alertname, wait 30s before the first notification, repeat every 5m.
policies:
  - orgId: 1
    receiver: quickticket-alerts
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 5m

# Lab 6 §6.2 — webhook receiver for the Grafana contact point.
#
# Stands in for webhook.site: a 30-line HTTP server that pretty-prints every
# alert notification Grafana POSTs to it. Inspect deliveries with
#   kubectl logs -n monitoring deploy/webhook-receiver -f
#
# Runs on the QuickTicket gateway image purely because it already contains a
# Python runtime and is present in the k3d node (imagePullPolicy: Never) —
# the app code is not used, the container only runs receiver.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-receiver-code
  namespace: monitoring
data:
  receiver.py: |
    """Minimal alert-notification sink. Logs every POST body to stdout."""
    import datetime
    import http.server
    import json

    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _now(self):
            return datetime.datetime.now(datetime.timezone.utc).strftime(
                "%Y-%m-%dT%H:%M:%SZ"
            )

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            raw = self.rfile.read(length)
            try:
                body = json.dumps(json.loads(raw), indent=2, sort_keys=True)
            except Exception:
                body = raw.decode("utf-8", "replace")
            print(f"===== {self._now()} POST {self.path} =====", flush=True)
            print(body, flush=True)
            payload = b'{"status":"received"}'
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            payload = b"webhook-receiver alive\n"
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, *args):
            pass

    print("webhook-receiver listening on :8090", flush=True)
    http.server.ThreadingHTTPServer(("", 8090), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
        - name: receiver
          image: ghcr.io/vanady39/quickticket-gateway:ae1a4579f016fd3e7b68ad97a4b998660af38d3c
          imagePullPolicy: Never
          command: ["python", "-u", "/opt/receiver/receiver.py"]
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8090
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /opt/receiver
      volumes:
        - name: code
          configMap:
            name: webhook-receiver-code
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: monitoring
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: 8090
      targetPort: 8090
      name: http

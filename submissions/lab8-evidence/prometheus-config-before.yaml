apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: gateway
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          # Only scrape pods labeled app=gateway.
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: gateway
            action: keep
          # Use the pod IP:8080 directly (bypass the Service — we want per-pod series).
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:8080
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # CRITICAL for Argo Rollouts canary analysis: copy the
          # rollouts-pod-template-hash label (set automatically by Argo Rollouts)
          # into rs_hash so the AnalysisTemplate query can filter canary vs stable.
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: rs_hash
kind: ConfigMap
metadata:
  annotations:

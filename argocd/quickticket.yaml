apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickticket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tdzdslippen/SRE-Intro.git
    targetRevision: main
    path: k8s
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

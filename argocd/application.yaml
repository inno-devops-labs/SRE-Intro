apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickticket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nikitadev-work/SRE-Intro.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true

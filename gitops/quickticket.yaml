apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickticket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Walkerino/SRE-Intro.git
    targetRevision: feature/lab5
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

# Full checkout load on a dedicated stocked event, derived from labs/lab8.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixedload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mixedload
  template:
    metadata:
      labels:
        app: mixedload
    spec:
      containers:
        - name: curl
          image: curlimages/curl@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          command: [sh, -c]
          args:
            - |
              while true; do
                curl --max-time 12 -s -o /dev/null -w 'events %{http_code} %{time_total}s\n' http://gateway:8080/events
                RES=$(curl --max-time 12 -s -X POST http://gateway:8080/events/7808/reserve \
                  -H 'Content-Type: application/json' -d '{"quantity":1}')
                RID=$(echo "$RES" | sed -n 's/.*reservation_id":"\([^"]*\).*/\1/p')
                if [ -n "$RID" ]; then
                  curl --max-time 12 -s -X POST -o /dev/null -w 'pay %{http_code} %{time_total}s\n' \
                    "http://gateway:8080/reserve/$RID/pay"
                else
                  echo "reserve failed: $RES"
                fi
                sleep 0.3
              done

apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: events
          image: quickticket-events:lab12-b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          lifecycle:
            # Same reason as gateway: keep serving while the pod is removed from
            # Service endpoints (12.2: killing an events pod gave ConnectError 502s).
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "quickticket"
            - name: DB_USER
              value: "quickticket"
            - name: DB_PASS
              value: "quickticket"
            - name: DB_MAX_CONNS
              value: "10"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TIMEOUT_MS
              value: "1000"
            - name: RESERVATION_TTL
              value: "300"
          # Liveness = "is this process alive?" only. /metrics has no downstream
          # dependencies; restarting a pod can't fix a missing dependency (Lab 8, Exp 3).
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Readiness checks Postgres (which every events path needs) but not Redis,
          # so a Redis outage breaks only reservations instead of the whole service.
          readinessProbe:
            httpGet:
              path: /events
              port: 8081
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: events
spec:
  selector:
    app: events
  ports:
    - port: 8081
      targetPort: 8081

apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  labels:
    app: events
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: events
          image: quickticket-events:lab12-b
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: quickticket
            - name: DB_USER
              value: quickticket
            - name: DB_PASS
              value: quickticket
            - name: DB_MAX_CONNS
              value: '10'
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_TIMEOUT_MS
              value: '1000'
            - name: RESERVATION_TTL
              value: '300'
          ports:
            - containerPort: 8081
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 6"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 12
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 4
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: events
spec:
  type: ClusterIP
  selector:
    app: events
  ports:
    - port: 8081
      targetPort: 8081

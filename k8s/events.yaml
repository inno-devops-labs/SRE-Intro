apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
    spec:
      containers:
      - name: events
        image: quickticket-events:v1
        imagePullPolicy: Never
        ports:
        - name: tcp
          containerPort: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: '5432'
        - name: DB_NAME
          value: quickticket
        - name: DB_USER
          value: quickticket
        - name: DB_PASS
          value: quickticket
        - name: DB_MAX_CONNS
          value: '10'
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: '6379'
        - name: REDIS_TIMEOUT_MS
          value: '1000'
        - name: RESERVATION_TTL
          value: '300'
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: 8081
          periodSeconds: 2
          failureThreshold: 30
      initContainers:
      - name: wait-for-postgres
        image: postgres:17-alpine
        command:
        - sh
        - -c
        - until pg_isready -h postgres -U quickticket -d quickticket; do sleep 2;
          done
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - until redis-cli -h redis ping | grep -q PONG; do sleep 2; done
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: events
spec:
  type: ClusterIP
  selector:
    app: events
  ports:
  - name: tcp
    port: 8081
    targetPort: 8081

# QuickTicket — events service (catalogue + reservations, talks to Postgres + Redis)
#
# Translated from the `events` service in app/docker-compose.yaml.
# Service DNS names replace compose's network aliases: `postgres` / `redis`.
#
# NOTE: DB_PASS is a plain env value here to match the course manifests.
# In a real cluster it belongs in a Secret referenced via secretKeyRef.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  labels:
    app: events
    app.kubernetes.io/part-of: quickticket
spec:
  # Lab 12 §12.1 — 2 replicas. One replica means every pod eviction (node
  # drain, rolling update, OOM kill) is a full outage of this service for as
  # long as the replacement takes to become Ready. Two replicas is the minimum
  # count at which a PodDisruptionBudget can express anything at all:
  # `minAvailable: 1` over 2 pods allows exactly one voluntary disruption at a
  # time, which is what makes a rolling node drain both possible and safe.
  replicas: 2
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels:
        app: events
        app.kubernetes.io/part-of: quickticket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      # ghcr.io packages are private by default; this secret holds a classic PAT
      # with read:packages. Inert while imagePullPolicy is Never (no pull is
      # attempted) — required as soon as the policy flips to Always.
      imagePullSecrets:
        - name: ghcr-secret
      # Lab 12 §12.6 — same graceful-shutdown budget as the gateway Rollout.
      # The lab only asks for this on the gateway, but §12.2's coordinated
      # pod-kill measured 2 x HTTP 502 at the gateway caused by killing an
      # *events* pod: without a preStop hook the app closes its listener
      # before kube-proxy has removed it from the Service, and the in-flight
      # connections are reset. Fixing only the gateway would leave that hole
      # open on every other service.
      terminationGracePeriodSeconds: 40
      containers:
        - name: events
          image: ghcr.io/vanady39/quickticket-events:lab12b
          # Lab 5 §5.3: the manifests now carry the ghcr.io reference that CI
          # writes on every push. The registry copy does not exist yet (the fork
          # has not been pushed), so the image in the cluster is the locally
          # built one re-tagged with this name and loaded via `k3d image import`,
          # and the policy stays Never. Flip to Always once CI has published.
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "quickticket"
            - name: DB_USER
              value: "quickticket"
            - name: DB_PASS
              value: "quickticket"
            - name: DB_MAX_CONNS
              value: "10"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TIMEOUT_MS
              value: "1000"
            - name: RESERVATION_TTL
              value: "300"
          ports:
            - name: http
              containerPort: 8081
          # Lab 12 §12.6 — hold SIGTERM back for 10s so the endpoints /
          # kube-proxy removal of this pod completes before the app stops
          # accepting connections. See k8s/gateway.yaml for the full rationale.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # Readiness = "should THIS POD receive traffic?".
          #
          # Lab 8 §Bonus — this used to be `httpGet /health`. /health is 503
          # when *either* Postgres or Redis is down, and Redis is NOT a hard
          # dependency of this service: GET /events and GET /events/{id} read
          # Postgres only. Lab 8 Experiment 3 measured the consequence — with
          # Redis at 0 replicas this pod was pulled out of the events Service
          # even though `curl http://<podIP>:8081/events` still returned 200 in
          # 5 ms, which in turn cascaded into the gateway and took the whole
          # application down.
          #
          # GET /events is the correct readiness signal for this service: it is
          # a real read that exercises the psycopg2 pool and Postgres (the hard
          # dependency, without which nothing here works) and does not touch
          # Redis (the soft dependency, whose loss should only degrade
          # /reserve). Cost is one small GROUP BY every 5 s.
          # /health is unchanged — still deep, still the right thing to alert on.
          readinessProbe:
            httpGet:
              path: /events
              port: 8081
            periodSeconds: 5
            failureThreshold: 2
          # Liveness = "is this process wedged?". It deliberately does NOT use
          # /health: that endpoint checks Postgres and Redis, and restarting the
          # events pod cannot fix a down database — it would only add a restart
          # loop on top of an outage. A TCP accept on 8081 proves the uvicorn
          # event loop is still alive, which is what liveness is actually for.
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: events
  labels:
    app: events
    app.kubernetes.io/part-of: quickticket
spec:
  type: ClusterIP
  selector:
    app: events
  ports:
    - name: http
      port: 8081
      targetPort: 8081

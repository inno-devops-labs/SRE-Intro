apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: events
  name: events
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: events
    spec:
      containers:
      - args:
        - main:app
        - --host
        - 0.0.0.0
        - --port
        - "8081"
        - --timeout-graceful-shutdown
        - "30"
        command:
        - uvicorn
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: quickticket
        - name: DB_USER
          value: quickticket
        - name: DB_PASS
          value: quickticket
        - name: DB_MAX_CONNS
          value: "10"
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_TIMEOUT_MS
          value: "1000"
        - name: RESERVATION_TTL
          value: "300"
        image: quickticket-events:lab12-scheduled-v1
        imagePullPolicy: Never
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 10
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        name: events
        ports:
        - containerPort: 8081
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      terminationGracePeriodSeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: events
  name: events
  namespace: default
spec:
  ports:
  - name: http
    port: 8081
    targetPort: 8081
  selector:
    app: events
  type: ClusterIP

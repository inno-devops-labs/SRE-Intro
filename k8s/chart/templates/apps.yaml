{{- range $name := list "gateway" "events" "payments" }}
{{- $app := index $.Values $name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: {{ $name }}
          image: {{ $app.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $app.port }}
          env:
            {{- if eq $name "gateway" }}
            - name: EVENTS_URL
              value: http://events:{{ $.Values.events.port }}
            - name: PAYMENTS_URL
              value: http://payments:{{ $.Values.payments.port }}
            - name: GATEWAY_TIMEOUT_MS
              value: {{ $app.timeoutMs | quote }}
            {{- else if eq $name "events" }}
            - name: DB_HOST
              value: {{ $app.db.host }}
            - name: DB_PORT
              value: {{ $app.db.port | quote }}
            - name: DB_NAME
              value: {{ $app.db.name }}
            - name: DB_USER
              value: {{ $app.db.user }}
            - name: DB_PASS
              value: {{ $app.db.password }}
            - name: DB_MAX_CONNS
              value: {{ $app.db.maxConnections | quote }}
            - name: REDIS_HOST
              value: {{ $app.redis.host }}
            - name: REDIS_PORT
              value: {{ $app.redis.port | quote }}
            - name: REDIS_TIMEOUT_MS
              value: {{ $app.redis.timeoutMs | quote }}
            - name: RESERVATION_TTL
              value: {{ $app.reservationTtl | quote }}
            {{- else }}
            - name: PAYMENT_FAILURE_RATE
              value: {{ $app.failureRate | quote }}
            - name: PAYMENT_LATENCY_MS
              value: {{ $app.latencyMs | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $app.port }}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $app.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
{{ toYaml $.Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $app.port }}
      targetPort: {{ $app.port }}
---
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "quickticket.labels" (dict "name" "gateway" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels: {{- include "quickticket.labels" (dict "name" "gateway" "root" $) | nindent 8 }}
      {{- include "quickticket.metricsAnnotations" (dict "port" .Values.gateway.port "root" $) | nindent 6 }}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: EVENTS_URL
              value: "http://events:{{ .Values.events.port }}"
            - name: PAYMENTS_URL
              value: "http://payments:{{ .Values.payments.port }}"
            - name: GATEWAY_TIMEOUT_MS
              value: {{ .Values.gateway.timeoutMs | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          {{- include "quickticket.probes" (dict "port" .Values.gateway.port "root" $) | nindent 10 }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "quickticket.labels" (dict "name" "gateway" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}

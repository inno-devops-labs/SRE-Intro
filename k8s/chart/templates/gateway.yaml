apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: {{ .Values.gateway.image | quote }}
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: EVENTS_URL
          value: {{ .Values.gateway.env.EVENTS_URL | quote }}
        - name: PAYMENTS_URL
          value: {{ .Values.gateway.env.PAYMENTS_URL | quote }}
        - name: GATEWAY_TIMEOUT_MS
          value: {{ .Values.gateway.env.GATEWAY_TIMEOUT_MS | quote }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          ports: [{containerPort: {{ .Values.gateway.port }}}]
          env:
            - {name: EVENTS_URL, value: {{ .Values.gateway.eventsUrl | quote }}}
            - {name: PAYMENTS_URL, value: {{ .Values.gateway.paymentsUrl | quote }}}
            - {name: GATEWAY_TIMEOUT_MS, value: {{ .Values.gateway.timeoutMs | quote }}}
          livenessProbe:
            httpGet: {path: /health, port: {{ .Values.gateway.port }}}
            {{- toYaml .Values.gateway.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: {{ .Values.gateway.port }}}
            {{- toYaml .Values.gateway.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  type: ClusterIP
  selector: {app: gateway}
  ports: [{port: {{ .Values.gateway.port }}, targetPort: {{ .Values.gateway.port }}}]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: NOTIFICATIONS_URL
              value: {{ .Values.gateway.notificationsUrl | quote }}
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            - name: RETRY_MAX
              value: {{ .Values.gateway.retryMax | quote }}
            - name: RETRY_BASE_DELAY_MS
              value: {{ .Values.gateway.retryBaseDelayMs | quote }}
            - name: CB_FAILURE_THRESHOLD
              value: {{ .Values.gateway.cbFailureThreshold | quote }}
            - name: CB_COOLDOWN_S
              value: {{ .Values.gateway.cbCooldownS | quote }}
            - name: RATE_LIMIT_RPS
              value: {{ .Values.gateway.rateLimitRps | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: events
  labels: {{- include "quickticket.labels" (dict "name" "events" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.events.replicas }}
  selector:
    matchLabels:
      app: events
  template:
    metadata:
      labels: {{- include "quickticket.labels" (dict "name" "events" "root" $) | nindent 8 }}
      {{- include "quickticket.metricsAnnotations" (dict "port" .Values.events.port "root" $) | nindent 6 }}
    spec:
      containers:
        - name: events
          image: {{ .Values.events.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DB_HOST
              value: {{ .Values.events.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.events.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.events.db.name | quote }}
            - name: DB_USER
              value: {{ .Values.events.db.user | quote }}
            - name: DB_PASS
              value: {{ .Values.events.db.password | quote }}
            - name: DB_MAX_CONNS
              value: {{ .Values.events.db.maxConns | quote }}
            - name: REDIS_HOST
              value: {{ .Values.events.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.events.redis.port | quote }}
            - name: REDIS_TIMEOUT_MS
              value: {{ .Values.events.redis.timeoutMs | quote }}
            - name: RESERVATION_TTL
              value: {{ .Values.events.reservationTtl | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.events.port }}
          {{- include "quickticket.probes" (dict "port" .Values.events.port "root" $) | nindent 10 }}
          resources: {{- toYaml .Values.events.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: events
  labels: {{- include "quickticket.labels" (dict "name" "events" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: events
  ports:
    - name: http
      port: {{ .Values.events.port }}
      targetPort: {{ .Values.events.port }}

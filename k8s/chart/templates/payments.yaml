apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
    {{- include "quickticket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.payments.replicas }}
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: {{ .Values.payments.image }}
          imagePullPolicy: {{ .Values.localImagePullPolicy }}
          ports:
            - containerPort: 8082
          env:
            - name: PAYMENT_FAILURE_RATE
              value: {{ .Values.payments.failureRate | quote }}
            - name: PAYMENT_LATENCY_MS
              value: {{ .Values.payments.latencyMs | quote }}
          {{- include "quickticket.httpProbes" (dict "port" 8082 "liveness" "/health") | nindent 10 }}
          {{- include "quickticket.resources" . | nindent 10 }}
---
{{ include "quickticket.service" (dict "name" "payments" "port" 8082 "root" .) }}

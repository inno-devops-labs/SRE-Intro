# This template renders the Payments Deployment and Service.
# The Payments service includes configurable fault-injection values used in labs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: {{ .Values.payments.replicas }}
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: payments
#          image: {{ .Values.payments.image | quote }}
          image: ghcr.io/rmcavalcante7/quickticket-payments:b9d0d9d1f3c3e5a1c9977444389f4eb9eade7e64
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.payments.port }}
          # Liveness checks a lightweight process endpoint.
          livenessProbe:
            httpGet:
              path: {{ .Values.payments.probes.livenessPath | quote }}
              port: {{ .Values.payments.port }}
            initialDelaySeconds: {{ .Values.global.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.global.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.global.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.global.probes.liveness.failureThreshold }}
          # Readiness checks whether the Payments HTTP API is ready to serve traffic.
          readinessProbe:
            httpGet:
              path: {{ .Values.payments.probes.readinessPath | quote }}
              port: {{ .Values.payments.port }}
            initialDelaySeconds: {{ .Values.global.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.global.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.global.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.global.probes.readiness.failureThreshold }}
          resources:
{{ toYaml .Values.global.resources | indent 12 }}
          env:
            - name: PAYMENT_FAILURE_RATE
              value: {{ .Values.payments.failureRate | quote }}
            - name: PAYMENT_LATENCY_MS
              value: {{ .Values.payments.latencyMs | quote }}
---
# The Service keeps the stable in-cluster DNS name payments.
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  type: {{ .Values.global.serviceType }}
  selector:
    app: payments
  ports:
    - port: {{ .Values.payments.port }}
      targetPort: {{ .Values.payments.port }}

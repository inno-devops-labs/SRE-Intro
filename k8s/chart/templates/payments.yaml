apiVersion: apps/v1
kind: Deployment
metadata: {name: payments}
spec:
  replicas: {{ .Values.payments.replicas }}
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
        - name: payments
          image: {{ .Values.payments.image }}
          imagePullPolicy: {{ .Values.payments.imagePullPolicy }}
          ports: [{containerPort: {{ .Values.payments.port }}}]
          env:
            - {name: PAYMENT_FAILURE_RATE, value: {{ .Values.payments.failureRate | quote }}}
            - {name: PAYMENT_LATENCY_MS, value: {{ .Values.payments.latencyMs | quote }}}
          livenessProbe:
            httpGet: {path: /health, port: {{ .Values.payments.port }}}
            {{- toYaml .Values.payments.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet: {path: /health, port: {{ .Values.payments.port }}}
            {{- toYaml .Values.payments.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.payments.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: payments}
spec:
  type: ClusterIP
  selector: {app: payments}
  ports: [{port: {{ .Values.payments.port }}, targetPort: {{ .Values.payments.port }}}]

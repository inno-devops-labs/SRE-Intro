apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels: {{- include "quickticket.labels" (dict "name" "payments" "root" $) | nindent 4 }}
spec:
  replicas: {{ .Values.payments.replicas }}
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels: {{- include "quickticket.labels" (dict "name" "payments" "root" $) | nindent 8 }}
      {{- include "quickticket.metricsAnnotations" (dict "port" .Values.payments.port "root" $) | nindent 6 }}
    spec:
      containers:
        - name: payments
          image: {{ .Values.payments.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: PAYMENT_FAILURE_RATE
              value: {{ .Values.payments.failureRate | quote }}
            - name: PAYMENT_LATENCY_MS
              value: {{ .Values.payments.latencyMs | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.payments.port }}
          {{- include "quickticket.probes" (dict "port" .Values.payments.port "root" $) | nindent 10 }}
          resources: {{- toYaml .Values.payments.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  labels: {{- include "quickticket.labels" (dict "name" "payments" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: payments
  ports:
    - name: http
      port: {{ .Values.payments.port }}
      targetPort: {{ .Values.payments.port }}

apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: {{ .Values.postgres.replicas }}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{containerPort: {{ .Values.postgres.port }}}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports: [{port: {{ .Values.postgres.port }}, targetPort: {{ .Values.postgres.port }}}]

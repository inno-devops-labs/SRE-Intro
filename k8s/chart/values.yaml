gateway:
  replicas: 1
  image: quickticket-gateway:v1
  env:
    EVENTS_URL: http://events:8081
    PAYMENTS_URL: http://payments:8082
    GATEWAY_TIMEOUT_MS: '5000'
events:
  replicas: 1
  image: quickticket-events:v1
  env:
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_NAME: quickticket
    DB_USER: quickticket
    DB_PASS: quickticket
    DB_MAX_CONNS: '10'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_TIMEOUT_MS: '1000'
    RESERVATION_TTL: '300'
payments:
  replicas: 1
  image: quickticket-payments:v1
  env:
    PAYMENT_FAILURE_RATE: '0.0'
    PAYMENT_LATENCY_MS: '0'
postgres:
  replicas: 1
  image: postgres:17-alpine
  env:
    POSTGRES_DB: quickticket
    POSTGRES_USER: quickticket
    POSTGRES_PASSWORD: quickticket
redis:
  replicas: 1
  image: redis:7-alpine
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

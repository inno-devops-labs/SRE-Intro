# Default values for the quickticket chart.
# Every value below is overridable with `--set` or `-f my-values.yaml`.

# Applied to every container. `Never` matches the raw manifests, which rely on
# images pushed into the cluster with `k3d image import`. Set to IfNotPresent
# (or Always) when pulling from a real registry.
imagePullPolicy: Never

gateway:
  replicas: 1
  image: quickticket-gateway:v1
  port: 8080
  timeoutMs: "5000"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

events:
  replicas: 1
  image: quickticket-events:v1
  port: 8081
  db:
    host: postgres
    port: 5432
    name: quickticket
    user: quickticket
    password: quickticket
    maxConns: "10"
  redis:
    host: redis
    port: 6379
    timeoutMs: "1000"
  reservationTtl: "300"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

payments:
  replicas: 1
  image: quickticket-payments:v1
  port: 8082
  # Fault-injection knobs used from Lab 1 onwards.
  failureRate: "0.0"
  latencyMs: "0"
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

postgres:
  enabled: true
  image: postgres:17-alpine
  port: 5432
  db: quickticket
  user: quickticket
  password: quickticket
  # Load files/seed.sql through /docker-entrypoint-initdb.d on first start.
  seed: true
  persistence:
    enabled: true
    size: 1Gi
    # storageClass: ""   # empty -> cluster default (local-path on k3d)
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Probe timings shared by the three application services. Liveness is a TCP
# accept, never an HTTP dependency check — see submissions/lab4.md Task 2.
probes:
  enabled: true
  readiness:
    periodSeconds: 5
    failureThreshold: 2
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

# Pod annotations for a scrape-by-annotation Prometheus (Lab 7).
metrics:
  annotations: true

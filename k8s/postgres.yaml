apiVersion: v1
+kind: PersistentVolumeClaim
+metadata:
+  name: postgres-data
+spec:
+  accessModes: [ReadWriteOnce]
+  resources:
+    requests:
+      storage: 1Gi
 ---
 containers:
   env:
+    - name: PGDATA
+      value: /var/lib/postgresql/data/pgdata
+  volumeMounts:
+    - name: data
+      mountPath: /var/lib/postgresql/data
+volumes:
+  - name: data
+    persistentVolumeClaim:
+      claimName: postgres-data

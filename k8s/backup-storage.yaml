apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-inspector
  template:
    metadata:
      labels:
        app: backup-inspector
    spec:
      containers:
        - name: inspector
          image: alpine:3.20
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: postgres-backups

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
      - name: notifications
        image: quickticket-notifications:v1
        imagePullPolicy: Never
        ports:
        - name: tcp
          containerPort: 8083
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: NOTIFY_FAILURE_RATE
          value: '0.0'
        - name: NOTIFY_LATENCY_MS
          value: '0'
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: 8083
          periodSeconds: 2
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  type: ClusterIP
  selector:
    app: notifications
  ports:
  - name: tcp
    port: 8083
    targetPort: 8083

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notifications
  name: notifications
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notifications
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
      - env:
        - name: NOTIFY_FAILURE_RATE
          value: "0.0"
        - name: NOTIFY_LATENCY_MS
          value: "0"
        image: quickticket-notifications:v1
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: notifications
        ports:
        - containerPort: 8083
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: default
spec:
  ports:
  - name: http
    port: 8083
    targetPort: http
  selector:
    app: notifications

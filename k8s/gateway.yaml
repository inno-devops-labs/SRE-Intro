apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    version: v2
spec:
  progressDeadlineSeconds: 60
  replicas: 5
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: ghcr.io/walkerino/quickticket-gateway:17b2fdb163812e011ade153c83cf598de034a616
        imagePullPolicy: Always
        ports:
        - name: tcp
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: EVENTS_URL
          value: http://events:8081
        - name: PAYMENTS_URL
          value: http://payments:8082
        - name: GATEWAY_TIMEOUT_MS
          value: '5000'
        - name: APP_VERSION
          value: v5-auto-good
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 2
          failureThreshold: 30
  strategy:
    canary:
      maxSurge: 0
      maxUnavailable: 1
      steps:
      - setWeight: 20
      - pause:
          duration: 20s
      - analysis:
          templates:
          - templateName: gateway-error-rate
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 60
      - pause:
          duration: 20s
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: tcp
    port: 8080
    targetPort: 8080

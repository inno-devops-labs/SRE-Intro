apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    version: "v8-bad"
spec:
  replicas: 5
  selector:
    matchLabels:
      app: gateway
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 20s }
        - setWeight: 50
        - pause: { duration: 20s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # imagePullSecrets removed – not needed for local image
      containers:
        - name: gateway
          # Use your local image (imported into k3d)
          image: quickticket-gateway:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            # Correct events endpoint
            - name: EVENTS_URL
              value: "http://events:8081"
            # Payment endpoint (if not set, default in code is fine)
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            # Notifications – required for Lab 11
            - name: NOTIFICATIONS_URL
              value: "http://notifications:8083"
            # Gateway timeout (kept as before)
            - name: GATEWAY_TIMEOUT_MS
              value: "2000"
            # Retry and circuit breaker tunables (defaults are fine, but you can override)
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_BASE_DELAY_MS
              value: "100"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_COOLDOWN_S
              value: "30"
            - name: RATE_LIMIT_RPS
              value: "10"
            # Optional bulkhead settings (defaults in code: 10 and 0.5)
            - name: BULKHEAD_PAYMENTS_MAX
              value: "10"
            - name: BULKHEAD_PAYMENTS_TIMEOUT_S
              value: "0.5"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
# QuickTicket — gateway (public entry point, fans out to events + payments)
#
# Translated from the `gateway` service in app/docker-compose.yaml.
# There is no Ingress yet: reach it with
#   kubectl port-forward svc/gateway 3080:8080
#
# Lab 7 §7.2 — this is no longer a Deployment. It is an Argo Rollout with a
# canary strategy. Everything below `template:` is byte-for-byte the Lab 5
# pod spec; only `apiVersion`, `kind`, `replicas` and `strategy` changed.
#
# Operational consequences for later labs:
#   * `kubectl get deployment gateway` returns NotFound. Use
#     `kubectl get rollout gateway` / `kubectl argo rollouts get rollout gateway`.
#   * `kubectl rollout status deployment/gateway` does not work either;
#     `kubectl argo rollouts status gateway` is the equivalent.
#   * A Rollout implements the `scale` subresource, so HPAs and
#     `kubectl scale rollout/gateway` work normally.
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: quickticket
    # Lab 5 §5.6 — marker used to prove the GitOps loop: this label was added
    # in Git only, never with kubectl, and ArgoCD reconciled it into the cluster.
    version: "v2"
spec:
  # Lab 7: 5 replicas so a canary weight of 20% is exactly 1 pod. With
  # replicas: 1 the only achievable weights are 0% and 100%.
  replicas: 5
  # Lab 7 bonus §B.3 — canary gated by automated analysis.
  #
  # There is no service mesh / ingress traffic-shaping provider here, so Argo
  # Rollouts approximates `setWeight: N` by replica count: it scales the canary
  # ReplicaSet to round(N% * 5) pods and the Service (selector `app: gateway`,
  # which matches stable *and* canary pods) spreads traffic over them via
  # kube-proxy. 20% => 1 of 5 pods.
  #
  # Earlier iterations of this file used, in order:
  #   §7.2  [20, pause{}, 60, pause 30s, 100]                 — manual promotion
  #   §7.8  [20, 60s, 40, 60s, 60, 60s, 80, 30s, 100]         — multi-step observation
  # Both are reproduced in submissions/lab7.md. The version kept here is the
  # one with the automated gate, because it is the only one that can abort a
  # bad release without a human watching.
  strategy:
    canary:
      steps:
        - setWeight: 20
        # Settle window before analysis starts. The AnalysisTemplate adds its
        # own `initialDelay: 60s` on top, so Prometheus has time to discover
        # (SD refresh ~10s) and scrape (5s interval) the new canary pod before
        # the first measurement is taken.
        - pause: {duration: 20s}
        - analysis:
            templates:
              - templateName: gateway-error-rate
            args:
              # Passes the canary ReplicaSet's pod-template-hash to the
              # template, which the Prometheus query uses as rs_hash="…" so it
              # measures canary replicas only. Prometheus gets that label from
              # the rollouts-pod-template-hash pod label via a relabel rule.
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 20s}
        - setWeight: 100
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: quickticket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # ghcr.io packages are private by default; this secret holds a classic PAT
      # with read:packages. Inert while imagePullPolicy is Never (no pull is
      # attempted) — required as soon as the policy flips to Always.
      imagePullSecrets:
        - name: ghcr-secret
      # Lab 12 §12.4 — spread the 5 replicas across nodes.
      #
      # Running 5 replicas buys nothing if the scheduler packs all 5 onto one
      # node: a single node failure is then still a total outage, and the
      # gateway-pdb (minAvailable: 2) would block the drain of that node
      # forever because there is nowhere else for the pods to go.
      #
      # maxSkew: 1 over topologyKey kubernetes.io/hostname means: after
      # scheduling, |count(most-loaded node) - count(least-loaded node)| <= 1
      # among nodes that match the selector. 5 pods over 3 nodes therefore
      # becomes 2/2/1, never 4/1/0 or 5/0/0.
      #
      # whenUnsatisfiable: ScheduleAnyway makes this a *preference*: the
      # scheduler scores nodes by skew but will still place a pod when no node
      # satisfies the constraint. DoNotSchedule would make it a hard predicate,
      # which on this single-node k3d cluster would leave 4 of the 5 pods
      # Pending forever.
      #
      # ⚠️ On this cluster the constraint is provably inert — there is exactly
      # one node (k3d-quickticket-server-0), so every distribution trivially
      # has skew 0. The YAML is still correct and is what would take effect
      # unchanged on a real multi-node cluster.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      # Lab 12 §12.6 — graceful shutdown budget.
      #
      # 10s preStop sleep + up to 30s for uvicorn to finish in-flight requests
      # = 40s. This MUST be >= preStop duration + worst-case drain, otherwise
      # the kubelet sends SIGKILL while preStop is still sleeping and the whole
      # exercise is pointless. The default of 30s would leave only 20s of
      # actual drain time.
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          # Lab 11 §11.4/§11.7/§11.8/§11.9 — the gateway source now contains
          # real retry / circuit-breaker / rate-limiter / bulkhead bodies, so
          # the image had to be rebuilt. New tag => new pod template hash =>
          # the change goes through the canary strategy above.
          image: ghcr.io/vanady39/quickticket-gateway:lab11
          # Lab 5 §5.3: the manifests now carry the ghcr.io reference that CI
          # writes on every push. The registry copy does not exist yet (the fork
          # has not been pushed), so the image in the cluster is the locally
          # built one re-tagged with this name and loaded via `k3d image import`,
          # and the policy stays Never. Flip to Always once CI has published.
          imagePullPolicy: Never
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            # Lab 7 §7.3 — the only thing that distinguishes "v1" from "v2" in
            # this lab. Changing it changes the pod template hash, which is
            # what actually triggers a new canary.
            - name: APP_VERSION
              value: "v2"
            # --- Lab 11 ---------------------------------------------------
            # Pointing this at a real URL is what switches the fire-and-forget
            # notify helper on; while it is empty the helper returns
            # immediately (that is how labs 1-10 stayed quiet).
            - name: NOTIFICATIONS_URL
              value: "http://notifications:8083"
            # Every resilience tunable is set explicitly, at its code default,
            # so it can be changed with `kubectl set env rollout/gateway ...`
            # during an experiment without rebuilding the image.
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_BASE_DELAY_MS
              value: "100"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_COOLDOWN_S
              value: "30"
            - name: RATE_LIMIT_RPS
              value: "10"
            # Bonus §11.9 — bounded concurrency towards payments. MAX is the
            # number of simultaneous /pay calls allowed to be in flight per
            # gateway pod; TIMEOUT_S is how long request 11+ waits for a slot
            # before being shed with 503.
            - name: BULKHEAD_PAYMENTS_MAX
              value: "10"
            - name: BULKHEAD_PAYMENTS_TIMEOUT_S
              value: "0.5"
          ports:
            - name: http
              containerPort: 8080
          # Lab 12 §12.6 — preStop hook.
          #
          # Pod deletion fans out to two independent control loops that race:
          #   (a) the kubelet, which runs preStop and then sends SIGTERM;
          #   (b) the endpoints/EndpointSlice controller -> every node's
          #       kube-proxy, which rewrites iptables so this pod stops
          #       receiving new connections.
          # Nothing in Kubernetes orders (b) before (a). Without a preStop
          # hook, uvicorn typically gets SIGTERM and closes its listener before
          # kube-proxy on every node has caught up, and the connections that
          # arrive in that window are RST -> the client sees a 502.
          #
          # `sleep 10` does not "do" anything except hold SIGTERM back long
          # enough for (b) to finish everywhere. The container keeps serving
          # normally for those 10 seconds — that is the point.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # Readiness = "should THIS POD receive traffic?".
          #
          # Lab 8 §Bonus — this used to be `httpGet /health`, and Lab 8's
          # Experiment 3 proved that to be the single worst resilience defect in
          # the system. /health is a DEEP check: it calls events and payments.
          # events' own /health is deep too and returns 503 when Redis is down.
          # So scaling Redis to 0 produced, in 19 seconds:
          #     redis gone -> events /health 503 -> events NotReady
          #     -> events removed from its Service -> gateway /health sees
          #        "events: down" -> 503 -> all 5 gateway pods NotReady
          #     -> gateway Service has ZERO endpoints -> total outage.
          # Measured: 18.4 rps -> 0 rps of user traffic, `curl` got HTTP 000
          # (connection refused), while every one of those pods was still
          # perfectly capable of serving GET /events (verified by hitting the
          # pod IPs directly: 200 in 5 ms).
          #
          # /metrics is a SHALLOW check: it is served by the same uvicorn
          # worker and the same middleware stack as every real request, touches
          # no downstream service, and therefore answers exactly the question
          # readiness is supposed to answer. A dependency outage now degrades
          # individual requests (502/504 with a real body) instead of removing
          # the whole service from DNS. /health is unchanged and still the
          # right endpoint for alerting and for humans — it is just no longer
          # wired to a control loop that can amplify an outage.
          #
          # Lab 12 §12.6 — TIMING tightened, PATH deliberately NOT changed.
          #
          # The lab text asks for `httpGet /health` here. That is exactly the
          # configuration Lab 8 Experiment 3 proved to be the worst resilience
          # defect in this system (the 19-second total outage described above),
          # and the Lab 8 fix is load-bearing for Lab 11's soft `notifications`
          # dependency as well. Reverting it to satisfy a code sample would
          # trade a real, measured availability property for a cosmetic match.
          # The path stays `/metrics`.
          #
          # What the lab actually needs from this block is *speed*: a pod that
          # is going away must leave the Service endpoints fast, or the preStop
          # sleep above is wasted. 5s x 2 failures = up to 10s of detection.
          # 2s x 1 failure = up to 2s, which is inside the 10s preStop window.
          # Cost is one extra /metrics scrape per pod every 2s, which is local
          # and touches no downstream service.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          # Liveness = "is this process wedged?". Measured in lab 4 §4.10: with
          # `httpGet /health` here, a 2-minute Redis outage restarted the
          # gateway 5 times — /health checks downstreams, and restarting the
          # gateway cannot bring Redis back. A TCP accept on 8080 proves the
          # uvicorn event loop is alive without dragging dependencies in.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: quickticket
spec:
  type: ClusterIP
  # Selector deliberately matches ONLY `app: gateway` — no pod-template-hash —
  # so both stable and canary pods are endpoints and kube-proxy performs the
  # traffic split. (Lab 7 common pitfall.)
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080

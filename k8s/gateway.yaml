apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    app: gateway
    version: "v2"
spec:
  # 5 replicas so canary weights map to whole pods (20% = 1 pod).
  replicas: 5
  # Default is 600s, so a failed rollout stays invisible for 10 minutes.
  progressDeadlineSeconds: 60
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 20s}
        - analysis:
            templates:
              - templateName: gateway-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 20s}
        - setWeight: 100
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Room for the 10 s preStop sleep plus up to 30 s of in-flight drain after SIGTERM.
      terminationGracePeriodSeconds: 40
      # Spread gateway pods across nodes: the per-node pod count may differ by at
      # most 1 (5 pods on 3 nodes → 2/2/1). ScheduleAnyway = preference, so a
      # single-node cluster (k3d here) still schedules all pods instead of Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      containers:
        - name: gateway
          image: quickticket-gateway:lab11-1   # built locally, `k3d image import`
          imagePullPolicy: IfNotPresent
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            - name: APP_VERSION
              value: "v2"
            # Lab 11: fire-and-forget order_confirmed events
            - name: NOTIFICATIONS_URL
              value: "http://notifications:8083"
            # Lab 11: resilience-pattern tunables (code defaults, set explicitly
            # so they can be changed with `kubectl argo rollouts set env` / git)
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_BASE_DELAY_MS
              value: "100"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_COOLDOWN_S
              value: "30"
            - name: RATE_LIMIT_RPS
              value: "10"
            - name: BULKHEAD_PAYMENTS_MAX
              value: "10"
            - name: BULKHEAD_PAYMENTS_TIMEOUT_S
              value: "0.5"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 1
          lifecycle:
            # Keep serving for 10 s after the pod is marked Terminating. The
            # endpoints controller removes a terminating pod from the Service at
            # once, but kube-proxy needs a moment to update every node's rules;
            # SIGTERM reaches uvicorn only after that, so no new connection is
            # sent to a socket that is already closed.
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080

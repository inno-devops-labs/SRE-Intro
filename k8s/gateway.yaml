apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 5                     # 5 replicas so canary weights map to whole pods (20% = 1 pod)
  strategy:
    canary:
      steps:                      # bonus: automated analysis gates the rollout
        - setWeight: 20
        - pause: {duration: 20s}
        - analysis:               # query Prometheus; abort if canary 5xx > 5%
            templates:
              - templateName: gateway-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 20s}
        - setWeight: 100
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: quickticket-gateway:v1     # Lab 11: locally-built image (k3d image import)
          imagePullPolicy: Never
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: NOTIFICATIONS_URL      # Lab 11: enables fire-and-forget notify
              value: "http://notifications:8083"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            # Resilience-pattern tunables (change via `kubectl set env`, no rebuild):
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_BASE_DELAY_MS
              value: "100"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_COOLDOWN_S
              value: "30"
            - name: RATE_LIMIT_RPS
              value: "10"
            - name: BULKHEAD_PAYMENTS_MAX
              value: "10"
            - name: BULKHEAD_PAYMENTS_TIMEOUT_S
              value: "0.5"
            - name: APP_VERSION        # bump this to trigger a canary rollout
              value: "v6"
          ports:
            - containerPort: 8080
          # Liveness = "is the process alive?" — TCP check, NOT /health, because the
          # gateway's /health is dependency-aware (503 when events/payments are down).
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Lab 8 bonus fix: readiness is a SHALLOW TCP check, not the
          # dependency-aware /health. A Redis/events outage no longer flips every
          # gateway pod to NotReady (which previously removed the whole gateway from
          # the Service and caused a total outage). Now the gateway stays in rotation
          # and keeps serving the paths that still work (e.g. /events); only the
          # Redis-dependent path (/reserve) degrades.
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway            # selects BOTH stable and canary pods (no pod-template-hash)
  ports:
    - port: 8080
      targetPort: 8080

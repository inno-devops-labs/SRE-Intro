# QuickTicket — gateway (public entry point, fans out to events + payments)
#
# Translated from the `gateway` service in app/docker-compose.yaml.
# There is no Ingress yet: reach it with
#   kubectl port-forward svc/gateway 3080:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: quickticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: quickticket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: quickticket-gateway:v1
          imagePullPolicy: Never # locally built image, imported with `k3d image import`
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
          ports:
            - name: http
              containerPort: 8080
          # Readiness = "should this pod receive traffic?". The gateway's
          # /health returns 503 when events or payments is unreachable, so a
          # downstream outage pulls this pod out of the Service endpoints.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          # Liveness = "is this process wedged?". Measured in lab 4 §4.10: with
          # `httpGet /health` here, a 2-minute Redis outage restarted the
          # gateway 5 times — /health checks downstreams, and restarting the
          # gateway cannot bring Redis back. A TCP accept on 8080 proves the
          # uvicorn event loop is alive without dragging dependencies in.
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: quickticket
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080

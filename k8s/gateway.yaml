apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:                
    app: gateway
    version: "v2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        version: "v2"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: gateway
        image: ghcr.io/viadimirsoiovev/quickticket-gateway:1133ec1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: EVENTS_URL
          value: "http://events:8081"
        - name: PAYMENTS_URL
          value: "http://payments:8082"
        - name: GATEWAY_TIMEOUT_MS
          value: "5000"
        resources:
          requests:
            cpu: 50m        
            memory: 64Mi    
          limits:
            cpu: 200m       
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10   
          periodSeconds: 10        
          timeoutSeconds: 5         
          failureThreshold: 3       
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5   
          periodSeconds: 5           
          timeoutSeconds: 3          
          failureThreshold: 2 
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP 
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
spec:
  replicas: 5
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: gateway
        image: ghcr.io/nikitadev-work/quickticket-gateway:85be3a96489cd32d3f045e706510161bd446da04
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: EVENTS_URL
          value: http://events:8081
        - name: PAYMENTS_URL
          value: http://payments:8082
        - name: GATEWAY_TIMEOUT_MS
          value: '5000'
        - name: APP_VERSION
          value: v5-auto
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /openapi.json
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /openapi.json
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
  strategy:
    canary:
      maxSurge: 0
      maxUnavailable: 1
      steps:
      - setWeight: 20
      - pause:
          duration: 20s
      - analysis:
          templates:
          - templateName: gateway-error-rate
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080

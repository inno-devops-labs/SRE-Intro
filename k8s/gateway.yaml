# Lab 7: the gateway is an Argo Rollouts canary instead of a Deployment.
# Service selector stays plain `app: gateway`, so stable and canary pods share
# traffic by replica count (no traffic router): 1 of 5 pods = 20%.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 5
  revisionHistoryLimit: 3
  # A canary that never becomes Ready never reaches the analysis step, so
  # without these two fields it waits at step 0 forever. With them the rollout
  # aborts itself 60s after the canary stops making progress.
  progressDeadlineSeconds: 60
  progressDeadlineAbort: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 20s}
        # gateway-error-rate lives in k8s/analysis-template.yaml and queries the
        # in-cluster Prometheus from labs/lab7/prometheus.yaml
        - analysis:
            templates:
              - templateName: gateway-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 20s}
        - setWeight: 100
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Lab 12: keep gateway replicas on different nodes. maxSkew 1 means the
      # busiest node holds at most one pod more than the emptiest one (5 pods on
      # 3 nodes: 2/2/1). ScheduleAnyway turns it into a preference, so on
      # single-node k3d the pods still schedule instead of staying Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      # Lab 12: covers the 10 s preStop sleep plus up to 30 s for uvicorn to finish
      # in-flight requests after SIGTERM. The default 30 s would leave 20 s.
      terminationGracePeriodSeconds: 40
      # Kept from Lab 5 for a fresh node that has to pull from private ghcr.io.
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gateway
          # Lab 11: built locally and imported with `k3d image import`, because
          # the resilience patterns are not in any CI-built ghcr.io tag yet.
          image: quickticket-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2"
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            # Lab 11: fire-and-forget destination for order_confirmed.
            - name: NOTIFICATIONS_URL
              value: "http://notifications:8083"
            # Lab 11 pattern tunables (defaults from app/gateway/main.py). All
            # of them are per pod: 5 replicas mean 5 breakers, 5 limiters, 5 bulkheads.
            - name: RETRY_MAX
              value: "3"
            - name: RETRY_BASE_DELAY_MS
              value: "100"
            - name: CB_FAILURE_THRESHOLD
              value: "5"
            - name: CB_COOLDOWN_S
              value: "30"
            - name: RATE_LIMIT_RPS
              value: "10"
            - name: BULKHEAD_PAYMENTS_MAX
              value: "10"
            - name: BULKHEAD_PAYMENTS_TIMEOUT_S
              value: "0.5"
          # Liveness asks only "is the process serving HTTP": /metrics touches no dependency.
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Readiness is shallow on purpose (lab 8 bonus). /health returns 503 when events
          # reports any dependency down, so a Redis outage took all 5 replicas out of the
          # Service at once although the gateway could still serve reads. A canary with a
          # broken dependency is now caught by the error-rate analysis, not by readiness.
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            # Lab 12: one failed probe 2 s apart takes the pod out of the Service,
            # instead of two failures 5 s apart (up to 10 s of traffic to a sick pod).
            periodSeconds: 2
            failureThreshold: 1
          # Lab 12: on delete the endpoints controller drops this pod from the
          # Service and the kubelet runs preStop at the same moment. The sleep keeps
          # uvicorn serving while kube-proxy on every node removes the pod IP, so
          # connections that still arrive in that window are answered, not refused.
          # SIGTERM reaches uvicorn only after the sleep.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 5                     # 5 replicas so canary weights map to whole pods (20% = 1 pod)
  strategy:
    canary:
      steps:                      # bonus: automated analysis gates the rollout
        - setWeight: 20
        - pause: {duration: 20s}
        - analysis:               # query Prometheus; abort if canary 5xx > 5%
            templates:
              - templateName: gateway-error-rate
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 20s}
        - setWeight: 100
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/jakefish18/quickticket-gateway:44a1520645acc7a36347ccd333e64543801011ad
          imagePullPolicy: Always
          env:
            - name: EVENTS_URL
              value: "http://events:8081"
            - name: PAYMENTS_URL
              value: "http://payments:8082"
            - name: GATEWAY_TIMEOUT_MS
              value: "5000"
            - name: APP_VERSION        # bump this to trigger a canary rollout
              value: "v6"
          ports:
            - containerPort: 8080
          # Liveness = "is the process alive?" — TCP check, NOT /health, because the
          # gateway's /health is dependency-aware (503 when events/payments are down).
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway            # selects BOTH stable and canary pods (no pod-template-hash)
  ports:
    - port: 8080
      targetPort: 8080

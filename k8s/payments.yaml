apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: payments
          image: ghcr.io/g-0-rg/quickticket-payments:340a6ba4557ab7fd19d4fef12961e0ccbe8fc327
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          lifecycle:
            # Same reason as gateway: keep serving while the pod is removed from
            # Service endpoints (12.2: killing an events pod gave ConnectError 502s).
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          env:
            - name: PAYMENT_FAILURE_RATE
              value: "0.0"
            - name: PAYMENT_LATENCY_MS
              value: "0"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app: payments
  ports:
    - port: 8082
      targetPort: 8082

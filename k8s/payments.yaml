apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payments
  name: payments
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - env:
        - name: PAYMENT_FAILURE_RATE
          value: "0.0"
        - name: PAYMENT_LATENCY_MS
          value: "0"
        image: ghcr.io/esqavator/quickticket-payments:b6f70905f9d21a6273dc7ea37996024ec5341c66
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
        name: payments
        ports:
        - containerPort: 8082
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: payments
  name: payments
  namespace: default
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  selector:
    app: payments
  type: ClusterIP

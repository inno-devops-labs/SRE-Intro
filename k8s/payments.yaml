apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
      - name: payments
        image: quickticket-payments:v1
        imagePullPolicy: Never
        ports:
        - name: tcp
          containerPort: 8082
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: PAYMENT_FAILURE_RATE
          value: '0.0'
        - name: PAYMENT_LATENCY_MS
          value: '0'
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 2
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          tcpSocket:
            port: 8082
          periodSeconds: 2
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  type: ClusterIP
  selector:
    app: payments
  ports:
  - name: tcp
    port: 8082
    targetPort: 8082

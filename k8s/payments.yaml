apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      imagePullSecrets:
        - name: ghcr-secret 
      containers:
      - name: payments
        image: ghcr.io/viadimirsoiovev/quickticket-payments:28a91268965beceb94e2f78aba5f30c50bb6ba6c
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        env:
        - name: PAYMENT_FAILURE_RATE
          value: "0.0"
        - name: PAYMENT_LATENCY_MS
          value: "0"
        resources:
          requests:
            cpu: 50m       
            memory: 64Mi    
          limits:
            cpu: 200m      
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app: payments
  ports:
  - port: 8082
    targetPort: 8082
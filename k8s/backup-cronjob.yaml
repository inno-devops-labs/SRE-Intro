apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "*/5 * * * *"          # every 5 minutes
  concurrencyPolicy: Forbid         # never stack backups if one runs long
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17-alpine      # ships pg_dump
              env:
                - { name: PGHOST, value: postgres }        # K8s Service DNS
                - { name: PGUSER, value: quickticket }
                - { name: PGDATABASE, value: quickticket }
                - { name: PGPASSWORD, value: quickticket }
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT="/backups/quickticket_${TS}.dump"
                  echo "dumping to $OUT"
                  pg_dump -Fc -f "$OUT"
                  echo "backup done: $(ls -lh "$OUT")"
                  # Retention: keep only the 5 newest dumps, delete the rest
                  cd /backups
                  ls -1t quickticket_*.dump | tail -n +6 | xargs -r rm -v
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups

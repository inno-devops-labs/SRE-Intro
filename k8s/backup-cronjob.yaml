apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGHOST
                  value: "postgres"
                - name: PGUSER
                  value: "quickticket"
                - name: PGDATABASE
                  value: "quickticket"
                - name: PGPASSWORD
                  value: "quickticket"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  cd /backups
                  FILE="quickticket_$(date -u +%Y%m%dT%H%M%SZ).dump"
                  # Dump to a temp name first, so a failed/partial dump never
                  # counts as one of the 5 "newest" backups during retention.
                  pg_dump -Fc -f "$FILE.partial"
                  mv "$FILE.partial" "$FILE"
                  echo "backup written: $FILE ($(wc -c < "$FILE") bytes)"
                  # Retention: keep the 5 newest dumps, delete the rest.
                  ls -1t quickticket_*.dump | tail -n +6 | xargs -r rm -v
                  echo "backups kept: $(ls -1 quickticket_*.dump | wc -l)"
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups

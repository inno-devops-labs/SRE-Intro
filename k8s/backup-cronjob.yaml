apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app: postgres-backup
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          containers:
            - name: pg-dump
              image: postgres:17-alpine
              env:
                - name: PGHOST
                  value: "postgres"
                - name: PGUSER
                  value: "quickticket"
                - name: PGDATABASE
                  value: "quickticket"
                - name: PGPASSWORD
                  value: "quickticket"
              command:
                - sh
                - -c
                - |
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -Fc > "/backups/quickticket_${TS}.dump"
                  echo "created /backups/quickticket_${TS}.dump"
                  ls -1t /backups/quickticket_*.dump | tail -n +6 | while read -r f; do
                    rm "$f" && echo "removed '$f'"
                  done
              volumeMounts:
                - name: backups
                  mountPath: /backups
          restartPolicy: OnFailure
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups

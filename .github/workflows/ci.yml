name: CI

on:
  push:
    branches:
      - main
      - feature/lab5
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build, push, and update QuickTicket images
    runs-on: ubuntu-latest

    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci:') }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set lowercase image owner
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        run: |
          docker build \
            --tag ghcr.io/${IMAGE_OWNER}/quickticket-gateway:${GITHUB_SHA} \
            ./app/gateway

          docker push \
            ghcr.io/${IMAGE_OWNER}/quickticket-gateway:${GITHUB_SHA}

      - name: Build and push events
        run: |
          docker build \
            --tag ghcr.io/${IMAGE_OWNER}/quickticket-events:${GITHUB_SHA} \
            ./app/events

          docker push \
            ghcr.io/${IMAGE_OWNER}/quickticket-events:${GITHUB_SHA}

      - name: Build and push payments
        run: |
          docker build \
            --tag ghcr.io/${IMAGE_OWNER}/quickticket-payments:${GITHUB_SHA} \
            ./app/payments

          docker push \
            ghcr.io/${IMAGE_OWNER}/quickticket-payments:${GITHUB_SHA}

      - name: Update image tags in manifests
        run: |
          sed -i -E \
            "s|image: ghcr.io/[^/]+/quickticket-gateway:[^[:space:]]+|image: ghcr.io/${IMAGE_OWNER}/quickticket-gateway:${GITHUB_SHA}|" \
            k8s/gateway.yaml \
            k8s/chart/values.yaml

          sed -i -E \
            "s|image: ghcr.io/[^/]+/quickticket-events:[^[:space:]]+|image: ghcr.io/${IMAGE_OWNER}/quickticket-events:${GITHUB_SHA}|" \
            k8s/events.yaml \
            k8s/chart/values.yaml

          sed -i -E \
            "s|image: ghcr.io/[^/]+/quickticket-payments:[^[:space:]]+|image: ghcr.io/${IMAGE_OWNER}/quickticket-payments:${GITHUB_SHA}|" \
            k8s/payments.yaml \
            k8s/chart/values.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add \
            k8s/gateway.yaml \
            k8s/events.yaml \
            k8s/payments.yaml \
            k8s/chart/values.yaml

          if git diff --cached --quiet; then
            echo "Image tags already point to ${GITHUB_SHA}"
            exit 0
          fi

          git commit \
            -m "ci: update image tags to ${GITHUB_SHA}"

          git push origin "HEAD:${GITHUB_REF_NAME}"

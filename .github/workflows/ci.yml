name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quickticket-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - gateway
          - events
          - payments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/tdzdslippen/quickticket-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/tdzdslippen/quickticket-${{ matrix.service }}:latest

  update-manifests:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci:') }}
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update image tags in manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: ghcr.io/tdzdslippen/quickticket-gateway:.*|image: ghcr.io/tdzdslippen/quickticket-gateway:${IMAGE_TAG}|" k8s/gateway.yaml
          sed -i "s|image: ghcr.io/tdzdslippen/quickticket-events:.*|image: ghcr.io/tdzdslippen/quickticket-events:${IMAGE_TAG}|" k8s/events.yaml
          sed -i "s|image: ghcr.io/tdzdslippen/quickticket-payments:.*|image: ghcr.io/tdzdslippen/quickticket-payments:${IMAGE_TAG}|" k8s/payments.yaml

      - name: Commit and push manifest update
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml
          git diff --cached --quiet || git commit -m "ci: update image tags to ${IMAGE_TAG}"
          git push


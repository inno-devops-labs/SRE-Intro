# Workflow file location inside the repository.
# GitHub Actions automatically discovers YAML files under .github/workflows/.
name: CI

# Events that start this workflow.
on:
  # Run the workflow whenever commits are pushed.
  push:
    # Limit the trigger to pushes on main, as required by Lab 5.
    branches: [main]

# Workflow jobs. Each job runs on a fresh GitHub-hosted runner.
jobs:
  # Job name shown in the GitHub Actions UI.
  build:
    # Use GitHub's latest Ubuntu runner image for Docker builds.
    runs-on: ubuntu-latest
    # Permissions granted to the automatically provided GITHUB_TOKEN.
    permissions:
      # Allow the workflow to publish container images to GitHub Container Registry.
      packages: write      # Needed to push to ghcr.io

    # Ordered commands/actions executed by the build job.
    steps:
      # This step uses a reusable GitHub Action.
      #
      # "actions/checkout" is the official GitHub Action that checks out the
      # repository code into the runner's filesystem.
      #
      # Why it is needed:
      # - A GitHub Actions runner starts as a fresh VM.
      # - It does not automatically contain our repository files.
      # - Without checkout, later commands like "docker build ./app/gateway"
      #   would fail because ./app/gateway would not exist on the runner.
      #
      # How we know what it does:
      # - The "uses:" value points to the action repository and version:
      #   actions/checkout@v4 means repository "actions/checkout", tag "v4".
      # - That action is maintained by GitHub and documented as the standard
      #   way to copy the workflow's repository into $GITHUB_WORKSPACE.
      - uses: actions/checkout@v4

      # This step logs Docker in to GitHub Container Registry.
      #
      # The "name" field is only the human-readable label shown in the Actions UI.
      # It does not perform the login by itself.
      - name: Log in to GitHub Container Registry
        # The actual behavior comes from this action:
        #
        # docker/login-action is the official Docker-maintained action for
        # running "docker login" in a workflow.
        #
        # "@v3" pins the action to major version 3.
        uses: docker/login-action@v3
        # Inputs passed to docker/login-action.
        # These correspond to the registry, username, and password that a normal
        # "docker login" command would need.
        with:
          # GitHub Container Registry hostname.
          # This tells Docker which registry we want to authenticate to.
          registry: ghcr.io
          # GitHub account or actor that triggered the workflow.
          # In this repository, it will usually be "rmcavalcante7".
          username: ${{ github.actor }}
          # Short-lived token automatically created for this workflow run.
          #
          # This token is not written by us and should not be hardcoded.
          # GitHub injects it at runtime through the secrets context.
          # The "packages: write" permission above allows this token to push
          # images to ghcr.io for this repository/user.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the gateway Docker image from app/gateway.
      #
      # This runs on the GitHub-hosted Ubuntu runner after checkout.
      # The image name uses GitHub Container Registry:
      # ghcr.io/rmcavalcante7/quickticket-gateway
      #
      # The tag is ${{ github.sha }}, the exact commit SHA that triggered
      # this workflow. That makes the image immutable and traceable to code.
      - name: Build gateway image
        run: docker build -t ghcr.io/rmcavalcante7/quickticket-gateway:${{ github.sha }} ./app/gateway

      # Push the gateway image to GitHub Container Registry.
      #
      # This works only because the previous docker/login-action step already
      # authenticated Docker to ghcr.io using GITHUB_TOKEN.
      - name: Push gateway image
        run: docker push ghcr.io/rmcavalcante7/quickticket-gateway:${{ github.sha }}

      # EVENTS
      - name: Build events image
        run: docker build -t ghcr.io/rmcavalcante7/quickticket-events:${{ github.sha }} ./app/events

      - name: Push events image
        run: docker push ghcr.io/rmcavalcante7/quickticket-events:${{ github.sha }}

      # PAYMENTS
      - name: Build payments image
        run: docker build -t ghcr.io/rmcavalcante7/quickticket-payments:${{ github.sha }} ./app/payments

      - name: Push payments image
        run: docker push ghcr.io/rmcavalcante7/quickticket-payments:${{ github.sha }}


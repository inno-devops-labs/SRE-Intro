name: CI

on:
  push:
    branches: [main, feature/lab5]
    paths-ignore:
      - 'submissions/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-update-manifests:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: georgypyanov
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        run: |
          docker build -t ghcr.io/georgypyanov/quickticket-gateway:${{ github.sha }} app/gateway
          docker push ghcr.io/georgypyanov/quickticket-gateway:${{ github.sha }}

      - name: Build and push events
        run: |
          docker build -t ghcr.io/georgypyanov/quickticket-events:${{ github.sha }} app/events
          docker push ghcr.io/georgypyanov/quickticket-events:${{ github.sha }}

      - name: Build and push payments
        run: |
          docker build -t ghcr.io/georgypyanov/quickticket-payments:${{ github.sha }} app/payments
          docker push ghcr.io/georgypyanov/quickticket-payments:${{ github.sha }}

      - name: Update raw manifest image tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          sha = "${{ github.sha }}"
          for service in ("gateway", "events", "payments"):
              path = Path(f"k8s/{service}.yaml")
              text = path.read_text()
              text = re.sub(
                  rf"image: .*quickticket-{service}:\S+",
                  f"image: ghcr.io/georgypyanov/quickticket-{service}:{sha}",
                  text,
              )
              path.write_text(text)
          PY

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml
          git diff --cached --quiet || git commit -m "ci(images): update image tags to ${{ github.sha }} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

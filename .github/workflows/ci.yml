name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: quickticket-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'ci:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/nikitadev-work/quickticket
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          for service in gateway events payments; do
            image="${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
            docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$image" "app/$service"
            docker push "$image"
          done

      - name: Update image tags
        run: |
          for service in gateway events payments; do
            sed -i "s|image: ghcr.io/.*/quickticket-${service}:.*|image: ${IMAGE_PREFIX}-${service}:${GITHUB_SHA}|" "k8s/$service.yaml"
          done

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: update image tags to ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

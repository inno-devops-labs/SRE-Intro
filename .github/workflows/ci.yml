name: CI

on:
  push:
    branches: [main, feature/lab5]
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service images
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="${GITHUB_SHA}"

          for SERVICE in gateway events payments; do
            IMAGE="ghcr.io/${OWNER}/quickticket-${SERVICE}:${SHA}"
            docker build -t "${IMAGE}" "./app/${SERVICE}"
            docker push "${IMAGE}"
          done

      - name: Update image tags in Kubernetes manifests
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA="${GITHUB_SHA}"

          sed -i "s|image: ghcr.io/.*/quickticket-gateway:.*|image: ghcr.io/${OWNER}/quickticket-gateway:${SHA}|" k8s/gateway.yaml
          sed -i "s|image: ghcr.io/.*/quickticket-events:.*|image: ghcr.io/${OWNER}/quickticket-events:${SHA}|" k8s/events.yaml
          sed -i "s|image: ghcr.io/.*/quickticket-payments:.*|image: ghcr.io/${OWNER}/quickticket-payments:${SHA}|" k8s/payments.yaml

      - name: Commit and push manifest update
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/
          if git diff --cached --quiet; then
            echo "No manifest image tag changes to commit."
          else
            git commit -m "ci: update image tags to ${GITHUB_SHA}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase registry owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./app/gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/quickticket-gateway:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push events
        uses: docker/build-push-action@v6
        with:
          context: ./app/events
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/quickticket-events:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push payments
        uses: docker/build-push-action@v6
        with:
          context: ./app/payments
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/quickticket-payments:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Update Kubernetes image tags
        run: |
          for service in gateway events payments; do
            sed -i -E "s|(^[[:space:]]*image: )ghcr.io/[^/]*/quickticket-${service}:[^[:space:]]+|\1ghcr.io/${IMAGE_OWNER}/quickticket-${service}:${GITHUB_SHA}|" "k8s/${service}.yaml"
            grep -Fq "image: ghcr.io/${IMAGE_OWNER}/quickticket-${service}:${GITHUB_SHA}" "k8s/${service}.yaml"
          done

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml
          if git diff --cached --quiet; then
            echo "Image tags already match the build SHA"
            exit 0
          fi
          git commit -m "ci: update image tags to ${GITHUB_SHA}"
          git push origin HEAD:main

name: CI

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: l10nff

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform images
        shell: bash
        run: |
          set -euo pipefail

          for service in gateway events payments; do
            image="${REGISTRY}/${IMAGE_OWNER}/quickticket-${service}:${GITHUB_SHA}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}" \
              --push \
              "./app/${service}"
          done

      - name: Update Kubernetes image tags
        shell: bash
        run: |
          set -euo pipefail

          for service in gateway events payments; do
            image="${REGISTRY}/${IMAGE_OWNER}/quickticket-${service}:${GITHUB_SHA}"

            if [ "$(grep -Ec "image: ${REGISTRY}/${IMAGE_OWNER}/quickticket-${service}:" "k8s/${service}.yaml")" -ne 1 ]; then
              echo "Expected exactly one image reference for ${service}" >&2
              exit 1
            fi

            sed -E -i \
              "s#image: ${REGISTRY}/${IMAGE_OWNER}/quickticket-${service}:[^[:space:]]+#image: ${image}#" \
              "k8s/${service}.yaml"
          done

          if git diff --quiet -- \
            k8s/gateway.yaml \
            k8s/events.yaml \
            k8s/payments.yaml
          then
            echo "Kubernetes image tags are already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            k8s/gateway.yaml \
            k8s/events.yaml \
            k8s/payments.yaml

          git commit -m "ci: update image tags to ${GITHUB_SHA}"
          git push origin HEAD:main

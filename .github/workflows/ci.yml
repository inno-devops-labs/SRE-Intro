name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: quickticket-main
  cancel-in-progress: false

jobs:
  build:
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'ci:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set lowercase registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push all three services
        run: |
          git checkout --detach "$GITHUB_SHA"
          for service in gateway events payments; do
            image="ghcr.io/$OWNER/quickticket-$service:$GITHUB_SHA"
            docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "app/$service"
            docker push "$image"
          done
      - name: Update image tags in manifests
        run: |
          git fetch origin main
          git checkout -B main origin/main
          for service in gateway events payments; do
            sed -i -E "s|image: .*quickticket-$service:.*|image: ghcr.io/$OWNER/quickticket-$service:$GITHUB_SHA|" "k8s/$service.yaml"
          done
      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml
          if ! git diff --cached --quiet; then
            git commit -m "ci: update image tags to $GITHUB_SHA"
            git push origin HEAD:main
          fi

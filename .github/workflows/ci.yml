name: QuickTicket CI

on:
  push:
    branches:
      - main
      - feature/lab5
  workflow_dispatch:

jobs:
  build-and-push:
    if: "!startsWith(github.event.head_commit.message, 'ci:')"
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - events
          - payments

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.service }}
          push: true
          tags: ghcr.io/m1d0rfeed/quickticket-${{ matrix.service }}:${{ github.sha }}

  update-manifests:
    if: "!startsWith(github.event.head_commit.message, 'ci:')"
    name: Update Kubernetes image tags
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update image tags
        run: |
          SHA=${{ github.sha }}

          sed -i "s|image: ghcr.io/m1d0rfeed/quickticket-gateway:.*|image: ghcr.io/m1d0rfeed/quickticket-gateway:${SHA}|" k8s/gateway.yaml
          sed -i "s|image: ghcr.io/m1d0rfeed/quickticket-events:.*|image: ghcr.io/m1d0rfeed/quickticket-events:${SHA}|" k8s/events.yaml
          sed -i "s|image: ghcr.io/m1d0rfeed/quickticket-payments:.*|image: ghcr.io/m1d0rfeed/quickticket-payments:${SHA}|" k8s/payments.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/gateway.yaml k8s/events.yaml k8s/payments.yaml

          git diff --cached --quiet || git commit -m "ci: update image tags to ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}